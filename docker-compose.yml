services:
  luvnotes:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: luvnotes-archive

    environment:
      TZ: ${TZ:-America/Chicago}

      # Authentication: either provide a short-lived PLAYGROUND_TOKEN, or
      # provide PLAYGROUND_EMAIL + PLAYGROUND_PASSWORD and the importer will
      # obtain a fresh actor-scoped Firebase ID token at startup and refresh it
      # during long archive runs when possible.
      PLAYGROUND_TOKEN: "${PLAYGROUND_TOKEN:-}"
      PLAYGROUND_EMAIL: "${PLAYGROUND_EMAIL:-}"
      PLAYGROUND_PASSWORD: "${PLAYGROUND_PASSWORD:-}"

      PLAYGROUND_SCHOOL_ID: ${PLAYGROUND_SCHOOL_ID}
      PLAYGROUND_STUDENT_ID: ${PLAYGROUND_STUDENT_ID}
      PLAYGROUND_GUARDIAN_ID: ${PLAYGROUND_GUARDIAN_ID}
      PLAYGROUND_ACCOUNT_ID: "${PLAYGROUND_ACCOUNT_ID:-}"

      ARCHIVE_ROOT: /archive
      PHOTOS_ROOT: /photos
      PAGE_SIZE: ${PAGE_SIZE:-50}

      # Optional recovery/debug controls.
      # PLAYGROUND_START_AFTER is an epoch-millisecond media-gallery seek
      # boundary used only for the first request (with reset=true).
      PLAYGROUND_START_AFTER: "${PLAYGROUND_START_AFTER:-}"
      EXIFTOOL_TIMEOUT_SECONDS: ${EXIFTOOL_TIMEOUT_SECONDS:-90}

    volumes:
      - ${LUVNOTES_ARCHIVE_PATH:-/volume1/docker/luvnotes/archive}:/archive
      - ${SYNOLOGY_PHOTOS_PATH}:/photos

    user: "${PUID}:${PGID}"

    restart: "no"

    read_only: true

    tmpfs:
      - /tmp:size=256m

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL
